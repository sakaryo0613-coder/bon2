# B-012 の下調べ（一時的）: 本物の Twitch から、アーカイブの情報・チャット・動画の冒頭を取れるか。
# 確かめたら clipper-windows.yml の確認に移して、このファイルは消す。
name: twitch-probe
on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/twitch-probe.yml"
      - ".dev-partner/data/works/youtube-clipper/app/clipper/twitch.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .dev-partner/data/works/youtube-clipper/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg > /dev/null && pip install -q "yt-dlp>=2026.10"
      - name: Twitch から取れるか
        run: python -m clipper.twitch probe probe-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-probe
          path: .dev-partner/data/works/youtube-clipper/app/probe-out/twitch_probe.json
