<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浅草シーシャbon | 公式サイト</title>
<meta name="description" content="浅草駅すぐ。朝9時から営業する古民家シーシャバー。観光の合間に、静かなひとときを。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Serif JP',serif;
  line-height:1.8;
  background:#0f0f0f;
  color:#f5f5f5;
}
a{text-decoration:none;color:inherit;}
section{padding:80px 20px;}
.container{max-width:1100px;margin:auto;}
h1,h2{font-weight:600;letter-spacing:2px;text-align:center;}
.btn{
  display:inline-block;
  padding:14px 30px;
  border:1px solid #fff;
  margin-top:20px;
  transition:0.3s;
}
.btn:hover{
  background:#fff;
  color:#000;
}

/* Hero */
.hero{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}
.hero-content{
  position:relative;
  z-index:2;
}
.hero h1{
  font-size:40px;
  margin-bottom:20px;
}
.hero p{
  font-size:18px;
}

/* About */
.about{
  background:#181818;
  text-align:center;
}

/* Features */
.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:40px;
}
.feature{
  background:#1f1f1f;
  padding:30px;
  border:1px solid #333;
}

/* Map */
.map iframe{
  border-radius:8px;
}

/* Footer */
footer{
  padding:40px 20px;
  text-align:center;
  border-top:1px solid #333;
  font-size:14px;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>浅草の静寂と、深いひとときを。</h1>
    <p>古民家で楽しむ、本格シーシャ体験</p>
    <a href="#access" class="btn">
